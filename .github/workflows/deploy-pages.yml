name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/vocaloid-card-game-design-l9yxqf
    paths:
      - "game/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Compile game (tsc)
        working-directory: game
        run: tsc -p tsconfig.json

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r game/index.html game/style.css game/dist _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
